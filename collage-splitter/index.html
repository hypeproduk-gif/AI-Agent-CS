<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pemisah Kolase Foto</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#2563eb;--bd:#e3e6ea}
  @media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mut:#9aa3ae;--ac:#5b8cff;--bd:#2d333b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
  main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.4rem;margin:0 0 4px}
  p.sub{color:var(--mut);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
  #drop{border:2px dashed var(--bd);border-radius:12px;padding:28px;text-align:center;cursor:pointer;color:var(--mut)}
  #drop.on{border-color:var(--ac);color:var(--ac)}
  #src{max-width:100%;max-height:300px;display:none;margin:12px auto 0;border-radius:8px}
  .row{display:flex;flex-wrap:wrap;gap:12px}
  label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:4px;flex:1 1 130px}
  input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
  .seg{display:flex;gap:8px;margin-bottom:12px}
  .seg label{flex-direction:row;align-items:center;color:var(--tx);font-size:1rem;gap:6px;flex:0 0 auto}
  .seg input{width:auto}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 18px;background:var(--ac);color:#fff;cursor:pointer}
  button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
  button:disabled{opacity:.5;cursor:default}
  #msg{margin:10px 0 0;color:var(--mut);min-height:1.4em}
  #msg.err{color:#dc2626}
  #out{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
  .it{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center;font-size:.8rem;color:var(--mut)}
  .it img{width:100%;height:130px;object-fit:contain;background:var(--bg);border-radius:6px}
  .it a{color:var(--ac);font-weight:600;text-decoration:none}
  .hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Pemisah Kolase Foto</h1>
  <p class="sub">Upload kolase, tentukan jumlah foto dan ukuran, lalu unduh hasilnya satu per satu. Semua diproses di browser Anda, tidak ada yang diunggah ke server.</p>

  <div class="card">
    <div id="drop">Klik atau seret kolase ke sini<input id="file" type="file" accept="image/*" hidden></div>
    <img id="src" alt="">
  </div>

  <div class="card">
    <div class="seg">
      <label><input type="radio" name="mode" value="grid" checked> Grid (baris × kolom)</label>
      <label><input type="radio" name="mode" value="auto"> Deteksi otomatis</label>
    </div>
    <div class="row" id="gridOpts">
      <label>Jumlah baris<input id="rows" type="number" min="1" value="2"></label>
      <label>Jumlah kolom<input id="cols" type="number" min="1" value="2"></label>
      <label>Buang tepi (px)<input id="pad" type="number" min="0" value="0"></label>
    </div>
    <div class="row hide" id="autoOpts">
      <label>Jumlah foto yang diharapkan<input id="count" type="number" min="1" value="4"></label>
      <label>Toleransi warna latar<input id="tol" type="number" min="1" max="200" value="30"></label>
      <label>Buang tepi (px)<input id="pad2" type="number" min="0" value="0"></label>
    </div>
    <hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">
    <div class="row">
      <label>Lebar output (px)<input id="w" type="number" min="0" placeholder="asli"></label>
      <label>Tinggi output (px)<input id="h" type="number" min="0" placeholder="asli"></label>
      <label>Jika lebar &amp; tinggi diisi
        <select id="fit"><option value="cover">Crop pas (cover)</option><option value="contain">Margin putih (contain)</option><option value="stretch">Tarik paksa</option></select></label>
      <label>Format
        <select id="fmt"><option value="jpeg">JPG</option><option value="png">PNG</option><option value="webp">WEBP</option></select></label>
      <label>Kualitas (JPG/WEBP)<input id="q" type="number" min="1" max="100" value="95"></label>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button id="go" disabled>Pisahkan</button>
      <button id="zip" class="sec hide">Unduh semua (ZIP)</button>
    </div>
    <div id="msg"></div>
    <div id="out"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let img = null, baseName = "kolase", results = [];

const setMsg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };

function loadFile(f) {
  if (!f || !f.type.startsWith("image/")) return setMsg("File harus berupa gambar.", true);
  baseName = f.name.replace(/\.[^.]+$/, "") || "kolase";
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    img = im; $("src").src = url; $("src").style.display = "block";
    $("go").disabled = false; setMsg(`Kolase dimuat: ${im.naturalWidth}×${im.naturalHeight}px`);
  };
  im.onerror = () => setMsg("Gagal membaca gambar.", true);
  im.src = url;
}
$("drop").onclick = () => $("file").click();
$("file").onchange = e => loadFile(e.target.files[0]);
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("on"); };
$("drop").ondragleave = () => $("drop").classList.remove("on");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("on"); loadFile(e.dataTransfer.files[0]); };
document.querySelectorAll("[name=mode]").forEach(r => r.onchange = () => {
  const auto = document.querySelector("[name=mode]:checked").value === "auto";
  $("gridOpts").classList.toggle("hide", auto); $("autoOpts").classList.toggle("hide", !auto);
});

// ---- deteksi otomatis: potong rekursif pada celah warna latar ----
function detectBoxes(tol, minGapFrac) {
  const S = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * S), h = Math.round(img.naturalHeight * S);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  const px = (x, y) => (y * w + x) * 4;
  const border = [];
  for (let x = 0; x < w; x++) { border.push(px(x, 0), px(x, h - 1)); }
  for (let y = 0; y < h; y++) { border.push(px(0, y), px(w - 1, y)); }
  const med = k => { const a = border.map(i => d[i + k]).sort((p, q) => p - q); return a[a.length >> 1]; };
  const bg = [med(0), med(1), med(2)];
  const fg = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = px(x, y);
    fg[y * w + x] = Math.max(Math.abs(d[i] - bg[0]), Math.abs(d[i + 1] - bg[1]), Math.abs(d[i + 2] - bg[2])) > tol ? 1 : 0;
  }
  const minGap = Math.max(2, Math.round(Math.min(w, h) * minGapFrac));
  const out = [];
  const trim = (x0, y0, x1, y1) => {
    let a = x1, b = y1, c2 = x0, e = y0;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (fg[y * w + x]) {
      if (x < a) a = x; if (x > c2) c2 = x; if (y < b) b = y; if (y > e) e = y;
    }
    return c2 >= a ? [a, b, c2 + 1, e + 1] : null;
  };
  // sumbu 0 = potong horizontal (mencari baris kosong), 1 = potong vertikal
  const split = (x0, y0, x1, y1, axis, tried) => {
    const t = trim(x0, y0, x1, y1); if (!t) return;
    [x0, y0, x1, y1] = t;
    const len = axis === 0 ? y1 - y0 : x1 - x0, cross = axis === 0 ? x1 - x0 : y1 - y0;
    const empty = [];
    for (let i = 0; i < len; i++) {
      let any = false;
      for (let j = 0; j < cross && !any; j++) any = fg[(axis === 0 ? (y0 + i) * w + x0 + j : (y0 + j) * w + x0 + i)] === 1;
      empty.push(!any);
    }
    const parts = []; let s = 0, i = 0;
    while (i < len) {
      if (empty[i]) { let j = i; while (j < len && empty[j]) j++; if (j - i >= minGap) { if (i > s) parts.push([s, i]); s = j; } i = j; } else i++;
    }
    if (s < len) parts.push([s, len]);
    if (parts.length > 1) {
      for (const [a, b] of parts) axis === 0 ? split(x0, y0 + a, x1, y0 + b, 1, 0) : split(x0 + a, y0, x0 + b, y1, 0, 0);
    } else if (tried < 1) split(x0, y0, x1, y1, 1 - axis, tried + 1);
    else out.push([x0, y0, x1, y1]);
  };
  split(0, 0, w, h, 0, 0);
  const minArea = w * h * 0.005;
  return out.filter(b => (b[2] - b[0]) * (b[3] - b[1]) > minArea)
    .map(b => b.map(v => Math.round(v / S)));
}

function gridBoxes(r, c) {
  const W = img.naturalWidth, H = img.naturalHeight, out = [];
  for (let i = 0; i < r; i++) for (let j = 0; j < c; j++)
    out.push([Math.round(j * W / c), Math.round(i * H / r), Math.round((j + 1) * W / c), Math.round((i + 1) * H / r)]);
  return out;
}

function render(box, tw, th, fit) {
  const [x0, y0, x1, y1] = box, sw = x1 - x0, sh = y1 - y0;
  let ow = sw, oh = sh;
  if (tw && th) { ow = tw; oh = th; } else if (tw) { ow = tw; oh = Math.round(sh * tw / sw); } else if (th) { oh = th; ow = Math.round(sw * th / sh); }
  const c = document.createElement("canvas"); c.width = ow; c.height = oh;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  if (tw && th && fit === "cover") {
    const sc = Math.max(ow / sw, oh / sh), cw = ow / sc, ch = oh / sc;
    g.drawImage(img, x0 + (sw - cw) / 2, y0 + (sh - ch) / 2, cw, ch, 0, 0, ow, oh);
  } else if (tw && th && fit === "contain") {
    g.fillStyle = "#fff"; g.fillRect(0, 0, ow, oh);
    const sc = Math.min(ow / sw, oh / sh), dw = sw * sc, dh = sh * sc;
    g.drawImage(img, x0, y0, sw, sh, (ow - dw) / 2, (oh - dh) / 2, dw, dh);
  } else g.drawImage(img, x0, y0, sw, sh, 0, 0, ow, oh);
  return c;
}

const blobOf = (c, fmt, q) => new Promise(r => c.toBlob(r, "image/" + fmt, fmt === "png" ? undefined : q / 100));

$("go").onclick = async () => {
  if (!img) return;
  const auto = document.querySelector("[name=mode]:checked").value === "auto";
  const pad = +(auto ? $("pad2") : $("pad")).value || 0;
  let boxes;
  if (auto) {
    boxes = detectBoxes(+$("tol").value || 30, 0.01);
    const want = +$("count").value;
    if (!boxes.length) return setMsg("Tidak ada foto terdeteksi. Coba ubah toleransi atau pakai mode Grid.", true);
    if (want && boxes.length !== want) setMsg(`Terdeteksi ${boxes.length} foto, bukan ${want}. Atur toleransi, atau pakai mode Grid.`, true);
  } else {
    const r = +$("rows").value, c = +$("cols").value;
    if (!(r > 0 && c > 0)) return setMsg("Isi jumlah baris dan kolom.", true);
    boxes = gridBoxes(r, c);
  }
  boxes = boxes.map(b => [b[0] + pad, b[1] + pad, b[2] - pad, b[3] - pad]).filter(b => b[2] - b[0] > 0 && b[3] - b[1] > 0);
  const tw = +$("w").value || 0, th = +$("h").value || 0, fit = $("fit").value, fmt = $("fmt").value, q = +$("q").value || 95;
  const ext = fmt === "jpeg" ? "jpg" : fmt;
  $("out").innerHTML = ""; results = [];
  $("go").disabled = true;
  for (let i = 0; i < boxes.length; i++) {
    const cv = render(boxes[i], tw, th, fit), blob = await blobOf(cv, fmt, q);
    const name = `${baseName}_${String(i + 1).padStart(2, "0")}.${ext}`, url = URL.createObjectURL(blob);
    results.push({ name, blob });
    const el = document.createElement("div"); el.className = "it";
    el.innerHTML = `<img src="${url}" alt=""><div>${cv.width}×${cv.height} · ${(blob.size / 1024).toFixed(0)} KB</div><a href="${url}" download="${name}">Unduh</a>`;
    $("out").appendChild(el);
  }
  $("go").disabled = false;
  $("zip").classList.toggle("hide", !results.length);
  if (!$("msg").classList.contains("err") || !auto) setMsg(`Selesai: ${results.length} foto.`);
};

$("zip").onclick = async () => {
  if (typeof JSZip === "undefined") return setMsg("Library ZIP gagal dimuat (cek koneksi). Unduh satu per satu.", true);
  const z = new JSZip(); results.forEach(r => z.file(r.name, r.blob));
  const b = await z.generateAsync({ type: "blob" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = baseName + "_hasil.zip"; a.click();
};
</script>
</body>
</html>
