<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Lisensi</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--line:#e3e1dc;--acc:#d9480f;--ok:#2b8a3e;--bad:#c92a2a}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#f2f2f2;--mut:#9a9aa0;--line:#2e2e33;--acc:#ff7a3d;--ok:#51cf66;--bad:#ff6b6b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 16px}h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{font-size:12px;font-weight:600;display:block;margin-bottom:3px}
input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 14px system-ui;cursor:pointer}
.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:4px 8px;font-size:12px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut)}code{font-size:13px}
.on{color:var(--ok)}.off{color:var(--bad)}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:8px;white-space:pre-wrap}
.stats{display:flex;gap:24px;flex-wrap:wrap;color:var(--mut)}.stats b{color:var(--ink);font-size:18px;display:block}
</style>
</head>
<body>
<div class="wrap">
<h1>Admin Lisensi UGC Flow Studio</h1>

<div class="card">
<div class="row">
<div style="flex:1;min-width:220px"><label for="tok">Token admin</label><input id="tok" type="password" style="width:100%"></div>
<button id="login">Masuk</button>
</div>
</div>

<div class="card">
<h2>Buat lisensi baru</h2>
<div class="row">
<div><label for="buyer">Pembeli / catatan</label><input id="buyer" placeholder="Nama / no. order"></div>
<div><label for="credits">Kredit</label><input id="credits" type="number" value="30" style="width:90px"></div>
<div><label for="days">Masa aktif (hari, kosong = selamanya)</label><input id="days" type="number" style="width:110px"></div>
<div><label for="count">Jumlah kode</label><input id="count" type="number" value="1" style="width:80px"></div>
<button id="create">Buat</button>
</div>
<pre id="newkeys" hidden></pre>
</div>

<div class="card">
<h2>Pemakaian 30 hari</h2>
<div class="stats" id="stats">—</div>
</div>

<div class="card">
<h2>Daftar lisensi</h2>
<div class="tbl"><table><thead><tr><th>Kode</th><th>Pembeli</th><th>Sisa</th><th>Terpakai</th><th>Berlaku sampai</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let tok="";try{tok=sessionStorage.getItem("adm")||""}catch(e){}
$("tok").value=tok;
const api=(p,o={})=>fetch("/api/admin"+p,{...o,headers:{"content-type":"application/json","x-admin-token":tok}}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error);return j});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){
  try{
    const {licenses,stats}=await api("/licenses");
    $("stats").innerHTML=`<div><b>${stats.runs}</b>generate</div><div><b>${(stats.input/1e6).toFixed(2)} jt</b>token input</div><div><b>${(stats.output/1e6).toFixed(2)} jt</b>token output</div>`;
    $("rows").innerHTML=licenses.map(l=>`<tr><td><code>${esc(l.key)}</code></td><td>${esc(l.buyer)}</td><td>${l.credits}</td><td>${l.used}</td><td>${l.expires_at?new Date(l.expires_at).toLocaleDateString("id-ID"):"—"}</td><td class="${l.active?"on":"off"}">${l.active?"Aktif":"Nonaktif"}</td><td><button class="ghost" data-a="add" data-k="${esc(l.key)}">+ Kredit</button> <button class="ghost" data-a="tog" data-on="${l.active}" data-k="${esc(l.key)}">${l.active?"Nonaktifkan":"Aktifkan"}</button></td></tr>`).join("");
  }catch(e){$("rows").innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`}
}
$("login").onclick=()=>{tok=$("tok").value.trim();try{sessionStorage.setItem("adm",tok)}catch(e){}load()};
$("create").onclick=async()=>{try{const {keys}=await api("/licenses",{method:"POST",body:JSON.stringify({buyer:$("buyer").value,credits:$("credits").value,days:$("days").value||null,count:$("count").value})});$("newkeys").hidden=false;$("newkeys").textContent=keys.join("\n");load()}catch(e){alert(e.message)}};
$("rows").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;
  if(b.dataset.a==="add"){const row=b.closest("tr");if(!row.querySelector(".addc")){b.insertAdjacentHTML("afterend",' <input class="addc" type="number" value="30" style="width:70px"> <button class="ghost" data-a="addok" data-k="'+esc(k)+'">OK</button>')}return}
  if(b.dataset.a==="addok"){const v=b.closest("td").querySelector(".addc").value;await api("/licenses/"+encodeURIComponent(k),{method:"PATCH",body:JSON.stringify({addCredits:v})});return load()}
  if(b.dataset.a==="tog"){await api("/licenses/"+encodeURIComponent(k),{method:"PATCH",body:JSON.stringify({active:b.dataset.on!=="1"})});load()}
};
if(tok)load();
</script>
</body>
</html>
