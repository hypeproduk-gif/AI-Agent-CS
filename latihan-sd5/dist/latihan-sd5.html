<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latihan Harian SD 5</title>
<meta name="theme-color" content="#2563eb">

<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--no:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}header button{background:#fff3;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mapel{border:2px solid var(--line);border-radius:14px;padding:14px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit}
.mapel b{display:block;font-size:17px}.mapel small{color:var(--mut)}.mapel.done{border-color:var(--ok);background:#f0fdf4}
.mapel .ic{font-size:28px}
.lvl{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.l1{background:#dcfce7;color:#166534}.l2{background:#fef9c3;color:#854d0e}.l3{background:#fee2e2;color:#991b1b}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:#e0e7ff;color:#1e3a8a}.btn.full{width:100%}
.q{font-size:18px;margin:8px 0 12px}.q blockquote{margin:10px 0;padding:10px 12px;background:#f8fafc;border-left:4px solid #93c5fd;font-size:16px}
.img{text-align:center;margin:8px 0}.img svg{max-width:100%;height:auto}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#dcfce7}.opt.no{border-color:var(--no);background:#fee2e2}
.bahas{background:#eff6ff;border-radius:10px;padding:12px;margin-top:10px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}.big{font-size:40px;font-weight:800}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.days button{border:0;border-radius:6px;padding:6px 0;font-size:12px;background:#e5e7eb;cursor:pointer}
.days .d{background:#86efac}.days .c{outline:2px solid var(--pri)}
#print{display:none}#lic{display:block;font-size:12px;opacity:.85;font-weight:400}#wm{position:fixed;inset:-50%;pointer-events:none;z-index:0;transform:rotate(-30deg);display:flex;flex-wrap:wrap;gap:60px 80px;align-content:center;justify-content:center;opacity:.10;font-size:18px;font-weight:700;color:#000;user-select:none}@media print{#wm{display:none}}.qi{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.qi:first-of-type{border-top:0}.legal{font-size:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px}.mat h3{margin:18px 0 6px;color:var(--pri)}.mat svg{max-width:100%;height:auto}.foot{text-align:center;font-size:12px;color:var(--mut);margin:20px 0}
@media print{header,main{display:none!important}#print{display:block;font-size:12px}#print .pq{break-inside:avoid;margin:8px 0}#print svg{max-height:140px;width:auto}#print h2{break-before:page}#print h2:first-child{break-before:auto}#print .wm{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:9px;color:#888}}
</style>
</head>

<script>// Ringkasan materi kelas 5 (Kurikulum Merdeka Fase C)
(function (G) {
  const S = G.CORE.S;
  G.MATERI = {
    MTK: [
      ["Bilangan Cacah sampai 1.000.000", `<p>Setiap angka punya <b>nilai tempat</b>: ratus ribuan, puluh ribuan, ribuan, ratusan, puluhan, satuan.</p><p>Contoh <b>485.231</b>: 4 = 400.000, 8 = 80.000, 5 = 5.000, 2 = 200, 3 = 30, 1 = 1.</p><p><b>Pembulatan:</b> lihat angka di kanan tempat yang dibulatkan. ≥ 5 dibulatkan ke atas, &lt; 5 tetap. 48.<u>6</u>70 → ribuan terdekat = 49.000.</p>`],
      ["Operasi Hitung", `<p>Urutan pengerjaan: <b>kurung → kali/bagi (kiri ke kanan) → tambah/kurang (kiri ke kanan)</b>.</p><p>Contoh: 20 + 5 × 4 = 20 + 20 = 40 (bukan 100).</p><p>Gunakan cara bersusun untuk bilangan besar dan periksa dengan taksiran (pembulatan).</p>`],
      ["Pecahan", `<p>Pecahan a/b: <b>a = pembilang</b> (bagian diambil), <b>b = penyebut</b> (banyak bagian sama besar).</p>${S.fracCircle(3, 8)}<p>Gambar di atas = 3/8.</p><p><b>Menjumlah/mengurang:</b> samakan penyebut dengan KPK. 1/2 + 1/3 = 3/6 + 2/6 = 5/6.</p><p><b>Mengali:</b> pembilang × pembilang, penyebut × penyebut. 2/3 × 3/4 = 6/12 = 1/2.</p><p><b>Membagi:</b> kalikan dengan kebalikan. 1/2 : 1/4 = 1/2 × 4/1 = 2.</p><p><b>Menyederhanakan:</b> bagi pembilang & penyebut dengan FPB-nya. 12/18 = 2/3.</p>`],
      ["Desimal dan Persen", `<p>Desimal: 0,5 = 5/10 = 1/2. 0,25 = 25/100 = 1/4.</p><p>Persen = per seratus. 40% = 40/100 = 2/5 = 0,4.</p><p><b>p% dari x</b> = p/100 × x. 25% dari 80 = 20.</p><p><b>Diskon:</b> harga bayar = harga − (diskon% × harga).</p>`],
      ["KPK dan FPB", `<p><b>KPK</b> (Kelipatan Persekutuan Terkecil): ambil semua faktor prima, pangkat <b>terbesar</b>. Dipakai untuk soal “bersamaan lagi”, “setiap … hari”.</p><p><b>FPB</b> (Faktor Persekutuan Terbesar): ambil faktor prima yang <b>sama</b>, pangkat <b>terkecil</b>. Dipakai untuk soal “dibagi sama banyak”, “paling banyak kantong”.</p><p>12 = 2² × 3, 18 = 2 × 3² → KPK = 2² × 3² = 36, FPB = 2 × 3 = 6.</p>`],
      ["Perbandingan dan Skala", `<p>Perbandingan a : b. Jika jumlah = J, bagian A = a/(a+b) × J.</p><p>Contoh: kelereng Ani : Budi = 2 : 3, jumlah 25 → Ani = 2/5 × 25 = 10.</p><p><b>Skala</b> = jarak peta : jarak sebenarnya. Jarak sebenarnya = jarak peta × penyebut skala. 4 cm, skala 1 : 500.000 → 2.000.000 cm = 20 km.</p>`],
      ["Kecepatan dan Debit", `<p><b>Kecepatan = jarak : waktu</b>, Jarak = kecepatan × waktu, Waktu = jarak : kecepatan.</p><p><b>Debit = volume : waktu</b> (liter/menit, liter/detik). Volume = debit × waktu.</p><p>Ingat: 1 jam = 60 menit, 1 m³ = 1.000 liter, 1 dm³ = 1 liter.</p>`],
      ["Pengukuran", `<p>Panjang: km–hm–dam–m–dm–cm–mm (turun 1 tangga ×10).</p><p>Berat: kg–hg (ons)–dag–g. 1 kg = 10 ons = 1.000 g.</p><p>Waktu: 1 jam = 60 menit = 3.600 detik.</p>`],
      ["Sudut", `${S.angle(60)}<p><b>Lancip</b> &lt; 90°, <b>siku-siku</b> = 90°, <b>tumpul</b> 90°–180°, <b>lurus</b> = 180°.</p><p>Sudut berpelurus jumlahnya 180°, sudut berpenyiku jumlahnya 90°. Alat ukur sudut: busur derajat.</p>`],
      ["Keliling dan Luas Bangun Datar", `<p>Persegi: K = 4 × s, L = s × s.</p><p>Persegi panjang: K = 2 × (p + l), L = p × l.</p>${S.triangle(8, 6, "cm")}<p>Segitiga: L = ½ × alas × tinggi = ½ × 8 × 6 = 24 cm².</p><p>Jajargenjang: L = a × t. Trapesium: L = ½ × (a + b) × t. Bangun gabungan: pecah jadi bangun sederhana lalu jumlahkan/kurangkan.</p>`],
      ["Volume Kubus dan Balok", `${S.box(5, 3, 4, "cm")}<p>Balok: <b>V = p × l × t</b> = 5 × 3 × 4 = 60 cm³.</p><p>Kubus: <b>V = s × s × s</b>. Rusuk kubus = akar pangkat tiga dari volume.</p><p>1 dm³ = 1 liter, 1.000 cm³ = 1 liter.</p>`],
      ["Penyajian Data", `${S.bars(["A", "B", "C", "D"], [6, 10, 4, 8], "Contoh diagram batang")}<p>Baca tinggi batang pada sumbu tegak. <b>Rata-rata</b> = jumlah data : banyak data. <b>Modus</b> = data paling sering muncul. <b>Selisih</b> = data besar − data kecil.</p>`],
    ],
    BIND: [
      ["Ide Pokok dan Kalimat Utama", `<p><b>Ide pokok</b> = gagasan utama sebuah paragraf. Ide pokok ada di dalam <b>kalimat utama</b>.</p><p>Kalimat utama bersifat umum; kalimat lain (<b>kalimat penjelas</b>) menjelaskannya.</p><p><b>Deduktif</b>: kalimat utama di awal. <b>Induktif</b>: di akhir. <b>Campuran</b>: di awal dan akhir.</p>`],
      ["Judul Bacaan", `<p>Judul harus mewakili isi/ide pokok, singkat, dan menarik. Kata pertama tiap kata penting ditulis kapital.</p>`],
      ["Informasi dalam Teks (5W + 1H)", `<p>Apa, Siapa, Kapan, Di mana, Mengapa, Bagaimana. Cari jawabannya langsung di dalam teks; garis bawahi kata kuncinya.</p>`],
      ["Fakta dan Opini", `<p><b>Fakta</b>: kejadian nyata yang bisa dibuktikan (ada data, angka, tempat, waktu).</p><p><b>Opini</b>: pendapat, sering memakai kata <i>menurut saya, sepertinya, paling, sangat, pasti, seharusnya</i>.</p>`],

<script>// Aplikasi latihan harian: 100 hari x 10 soal x 4 mapel. Level naik di hari 36 dan 71.
const MAPEL = { MTK: ["Matematika", "🔢"], BIND: ["Bahasa Indonesia", "📖"], BING: ["Bahasa Inggris", "🇬🇧"], IPA: ["IPA", "🔬"] };

const levelHari = (d) => (d >= 71 ? 3 : d >= 36 ? 2 : 1);

function soalHari(m, d) { const lv = levelHari(d); const pool = BANK[m].filter((q) => q.level === lv); const i = (d - LEVEL[lv].mulai) * PER_HARI; return pool.slice(i, i + PER_HARI); }
const hariSelesai = (d) => Object.keys(MAPEL).every((m) => ST.hasil[m + d]);

let pilihHari = null;
const today = () => new Date().toISOString().slice(0, 10);

  <div class="card"><div class="row"><div><div class="mut">Halo, ${esc(ST.nama)} 👋</div><b style="font-size:22px">Hari ke-${d}</b> <span class="lvl l${lv}">${LEVEL[lv].nama}</span></div><div style="text-align:right"><div class="big">🔥${ST.streak}</div><div class="mut">hari beruntun</div></div></div>

  <li>Klik mapel → <b>scroll</b> dan pilih jawaban. Benar/salah dan pembahasan langsung muncul. <b>Baca pembahasannya.</b></li>

  <div class="mut" style="margin-top:8px">Hari 1–35: Level 1 · Hari 36–70: Level 2 · Hari 71–100: Level 3</div></div>

// ---- Kode akses ----
async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join(""); }
async function cekKode(kode) {
  // Versi satu file (Scalev): hash kode tertanam di halaman. Versi Netlify: cek ke server.
  if (window.KODE_HASH) { try { return window.KODE_HASH.includes(await sha(kode)); } catch { return false; } }
  try { const r = await fetch("/api/verify", { method: "POST", body: JSON.stringify({ kode }) }); return (await r.json()).ok; } catch { return false; }
}
// ---- Kunci lisensi lintas perangkat (Google Apps Script, opsional) ----
// Isi dengan URL Web App dari tools/lisensi-apps-script.gs. Kosong = hanya terkunci di perangkat ini.
const LISENSI_URL = "";
const devId = () => ST.dev || (ST.dev = Math.random().toString(36).slice(2, 10));
async function server(aksi, data) {
  if (!LISENSI_URL) return null;
  try { const r = await fetch(LISENSI_URL, { method: "POST", body: JSON.stringify(Object.assign({ aksi, kode: await sha(ST.kode), dev: devId() }, data || {})) }); return await r.json(); } catch { return null; }
}

  document.getElementById("lic").textContent = ST.nama ? `Lisensi: ${ST.nama}${ST.kode ? " · " + ST.kode : ""}` : "";
  let w = document.getElementById("wm"); if (!ST.nama) { if (w) w.remove(); return; }
  if (!w) { w = document.createElement("div"); w.id = "wm"; document.body.appendChild(w); }
  const t = `Lisensi: ${esc(ST.nama)}${ST.kode ? " · " + ST.kode : ""}`;
  w.innerHTML = Array.from({ length: 40 }, () => `<span>${t}</span>`).join("");
}
function aktivasi() {
  $("#homeBtn").hidden = true;
  app.innerHTML = `<div class="card"><h2>🔐 Masukkan Kode Akses</h2><p>Kode akses dikirim setelah pembelian. Cukup sekali aktivasi per perangkat.</p>

}

function setup() {
  app.innerHTML = `<div class="card"><h2>Selamat datang! 🎉</h2><p>Latihan 10 soal per mapel setiap hari selama 100 hari: <b>4.000 soal</b> Matematika, Bahasa Indonesia, Bahasa Inggris, dan IPA sesuai Kurikulum Merdeka kelas 5. Tingkat kesulitan naik di hari ke-36 dan ke-71.</p>
  <label><b>Nama ANAK yang akan belajar</b> (bukan nama ayah/ibu)<input id="nm" placeholder="contoh: Rafi Pratama"></label><p class="mut">👧🧒 Isi dengan nama siswa kelas 5 yang akan mengerjakan soal. Nama ini tampil di rapor dan sertifikat belajar anak.</p><p class="mut">⚠️ Nama dikunci sebagai pemilik lisensi dan tercetak di setiap lembar. Pastikan sudah benar.</p><br><br><button class="btn full" id="go">Mulai Belajar</button></div>`;
  $("#go").onclick = async () => { const v = $("#nm").value.trim(); if (!v) return; if (!confirm(`Nama anak: "${v}"\n\nPastikan ini nama ANAK, bukan nama orang tua. Nama tidak bisa diubah. Lanjutkan?`)) return; const r = await server("kunci", { nama: v }); ST.nama = (r && r.nama) || v; save(); home(); };
}
function kuis(m, soal, d, isReview) {
  $("#homeBtn").hidden = false; const pil = {}; const log = [];
  app.innerHTML = `<div class="card"><div class="row"><b>${m ? MAPEL[m][1] + " " + MAPEL[m][0] + " · Hari ke-" + d : "🔁 Ulang soal salah"}</b><span class="mut" id="cnt">0/${soal.length} dijawab</span></div><div class="bar" style="margin-top:8px"><i id="pg" style="width:0"></i></div></div>
  <div class="card">${soal.map((q, i) => `<div class="qi" id="q${i}"><span class="lvl l${q.level}">${i + 1}. ${q.topik}</span><div class="q">${q.q}</div>${q.img ? `<div class="img">${q.img}</div>` : ""}${q.opsi.map((o, j) => `<button class="opt" data-i="${i}" data-j="${j}"><b>${"ABCD"[j]}.</b> ${o}</button>`).join("")}<div class="fb"></div></div>`).join("")}
  <br><button class="btn full" id="fin" disabled>Selesai & lihat nilai</button></div>`;
  app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
    const i = +b.dataset.i, j = +b.dataset.j, q = soal[i]; if (i in pil) return; pil[i] = j; const ok = j === q.jawab;
    log.push({ id: q.id, ok, topik: q.topik, mapel: q.mapel }); if (ok) delete ST.salah[q.id]; else ST.salah[q.id] = 1; save();
    const box = $("#q" + i); box.querySelectorAll(".opt").forEach((x, k) => { x.disabled = true; if (k === q.jawab) x.classList.add("ok"); else if (k === j) x.classList.add("no"); });
    box.querySelector(".fb").innerHTML = `<div class="bahas"><b>${ok ? "✅ Benar!" : "❌ Belum tepat."}</b> ${q.bahas}</div>`;
    const n = Object.keys(pil).length; $("#cnt").textContent = `${n}/${soal.length} dijawab`; $("#pg").style.width = (n / soal.length) * 100 + "%"; $("#fin").disabled = n < soal.length;
  }));
  $("#fin").onclick = () => {
    const benar = log.filter((l) => l.ok).length, nilai = Math.round((benar / soal.length) * 100);
    if (!isReview) { ST.hasil[m + d] = { nilai, log, tgl: today() }; if (ST.last !== today()) { const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10); ST.streak = ST.last === y ? ST.streak + 1 : 1; ST.last = today(); } }
    save(); const bintang = nilai >= 90 ? "⭐⭐⭐" : nilai >= 70 ? "⭐⭐" : nilai >= 50 ? "⭐" : "💪";
    app.innerHTML = `<div class="card" style="text-align:center"><div class="big">${bintang}</div><h2>Nilai ${nilai}</h2><p>${benar} dari ${soal.length} soal benar.</p><p class="mut">${nilai >= 70 ? "Keren! Pertahankan ya." : "Tidak apa-apa, soal yang salah tersimpan di menu Ulang Soal Salah."}</p><button class="btn full" id="bk">Kembali ke beranda</button></div>`;
    $("#bk").onclick = home; scrollTo(0, 0);
  };
  scrollTo(0, 0);
}
function review() {
  const all = Object.values(BANK).flat(); const ids = new Set(Object.keys(ST.salah));
  const s = all.filter((q) => ids.has(q.id)).slice(0, 10); if (s.length) kuis(null, s, 0, true);
}
function rapor() {
  $("#homeBtn").hidden = false; const tp = {};
  for (const h of Object.values(ST.hasil)) for (const l of h.log) { const k = MAPEL[l.mapel][0] + " — " + l.topik; tp[k] = tp[k] || [0, 0]; tp[k][1]++; if (l.ok) tp[k][0]++; }
  const rata = (m) => { const v = Object.entries(ST.hasil).filter(([k]) => k.startsWith(m) && !isNaN(k.slice(m.length))).map(([, h]) => h.nilai); return v.length ? Math.round(v.reduce((a, b) => a + b) / v.length) : "-"; };
  const lemah = Object.entries(tp).filter(([, v]) => v[1] >= 3).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).slice(0, 8);
  app.innerHTML = `<div class="card"><h2>📊 Rapor ${esc(ST.nama)}</h2><table><tr><th>Mapel</th><th>Rata-rata</th></tr>${Object.entries(MAPEL).map(([k, [n]]) => `<tr><td>${n}</td><td><b>${rata(k)}</b></td></tr>`).join("")}</table></div>
  <div class="card"><h3>Topik yang perlu dilatih lagi</h3>${lemah.length ? `<table>${lemah.map(([k, v]) => `<tr><td>${k}</td><td>${Math.round((v[0] / v[1]) * 100)}% benar</td></tr>`).join("")}</table>` : `<p class="mut">Kerjakan minimal beberapa hari dulu agar terlihat polanya.</p>`}</div>
  <div class="card"><button class="btn sec" id="rst">Hapus nilai & progres</button><p class="mut">Nama anak terkunci sebagai pemilik lisensi dan tidak ikut terhapus.</p></div>`;
  $("#rst").onclick = () => { if (confirm("Hapus semua nilai dan progres? Nama tetap tersimpan.")) { ST = { nama: ST.nama, hasil: {}, salah: {}, streak: 0, last: "", kode: ST.kode, setuju: ST.setuju }; save(); home(); } };
}
function ortu() {
  $("#homeBtn").hidden = false;
  app.innerHTML = `<div class="card"><h2>👪 Panduan Orang Tua</h2><ol>
  <li><b>Rutin 30–40 menit sehari.</b> 4 mapel × 10 soal. Lebih efektif daripada les 2× seminggu yang panjang.</li>
  <li><b>Biarkan anak membaca pembahasan</b> setiap selesai menjawab — di situ belajarnya terjadi.</li>
  <li><b>Akhir pekan:</b> buka “Ulang soal salah” dan “Rapor”, lalu fokuskan bantuan pada topik dengan persentase terendah.</li>
  <li><b>Level naik bertahap:</b> hari 1–35 dasar, 36–70 menengah, 71–100 mahir/soal cerita (HOTS).</li>
  <li><b>Cetak</b> jika anak lebih suka mengerjakan di kertas; kunci jawaban ada di halaman terakhir.</li></ol>
  <h3>Cakupan materi</h3><p class="mut">Matematika: bilangan cacah, pecahan, desimal, persen, KPK–FPB, perbandingan & skala, kecepatan & debit, sudut, luas, volume kubus–balok, penyajian data.<br>Bahasa Indonesia: ide pokok, kalimat utama/penjelas, paragraf deduktif–induktif, informasi teks, fakta–opini, sinonim–antonim, kata baku, imbuhan, majas, huruf kapital, kata tanya.<br>Bahasa Inggris: vocabulary, numbers, days & months, telling time, prepositions, jobs, places, simple present/continuous/past, comparison, reading.<br>IPA: cahaya & mata, bunyi & telinga, ekosistem & rantai makanan, magnet, listrik, energi, bumi & siklus air, organ tubuh.</p></div>`;
}
function cetak(d) {
  let h = "", kunci = "";
  for (const [k, [n]] of Object.entries(MAPEL)) {
    const s = soalHari(k, d);
    h += `<h2>${n} — Hari ke-${d} (${LEVEL[levelHari(d)].nama})</h2><p>Nama: ______________ Tanggal: ________</p>` + s.map((q, i) => `<div class="pq"><b>${i + 1}.</b> ${q.q}${q.img ? `<div>${q.img}</div>` : ""}<div>${q.opsi.map((o, j) => `${"abcd"[j]}. ${o}`).join("&nbsp;&nbsp;&nbsp; ")}</div></div>`).join("");
    kunci += `<p><b>${n}:</b> ${s.map((q, i) => `${i + 1}${"abcd"[q.jawab]}`).join(", ")}</p>`;
  }
  cetakHTML(h + `<h2>Kunci Jawaban Hari ke-${d}</h2>` + kunci);
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("#homeBtn").onclick = () => { pilihHari = null; home(); };
home();

</script>
</body>
