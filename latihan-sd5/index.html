<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les di Rumah Kelas 5</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--no:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:18px!important;margin:0!important;flex:1;color:#fff!important;display:block!important;line-height:1.3!important}header button{background:#fff3;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mapel{border:2px solid var(--line);border-radius:14px;padding:14px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit}
.mapel b{display:block;font-size:17px}.mapel small{color:var(--mut)}.mapel.done{border-color:var(--ok);background:#f0fdf4}
.mapel .ic{font-size:28px}
.lvl{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.l1{background:#dcfce7;color:#166534}.l2{background:#fef9c3;color:#854d0e}.l3{background:#fee2e2;color:#991b1b}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:#e0e7ff;color:#1e3a8a}.btn.full{width:100%}
.q{font-size:18px;margin:8px 0 12px}.q blockquote{margin:10px 0;padding:10px 12px;background:#f8fafc;border-left:4px solid #93c5fd;font-size:16px}
.img{text-align:center;margin:8px 0}.img svg{max-width:100%;height:auto}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#dcfce7}.opt.no{border-color:var(--no);background:#fee2e2}
.bahas{background:#eff6ff;border-radius:10px;padding:12px;margin-top:10px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}.big{font-size:40px;font-weight:800}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.days button{border:0;border-radius:6px;padding:6px 0;font-size:12px;background:#e5e7eb;cursor:pointer}
.days .d{background:#86efac}.days .c{outline:2px solid var(--pri)}
#print{display:none}#lic{display:block;font-size:12px;opacity:.85;font-weight:400}#wm{position:fixed;inset:-50%;pointer-events:none;z-index:0;transform:rotate(-30deg);display:flex;flex-wrap:wrap;gap:220px 260px;align-content:center;justify-content:center;opacity:.10;font-size:18px;font-weight:700;color:#000;user-select:none}@media print{#wm{display:none}}.qi{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.qi:first-of-type{border-top:0}.legal{font-size:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px}.mat h3{margin:18px 0 6px;color:var(--pri)}.mat svg{max-width:100%;height:auto}.foot{text-align:center;font-size:12px;color:var(--mut);margin:20px 0}
@media print{header,main{display:none!important}#print{display:block;font-size:12px}#print .pq{break-inside:avoid;margin:8px 0}#print svg{max-height:140px;width:auto}#print h2{break-before:page}#print h2:first-child{break-before:auto}#print .wm{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:9px;color:#888}}
</style>
</head>
<body>
<header><h1 id="title">📚 Les di Rumah Kelas 5<span id="lic"></span></h1><button id="homeBtn" hidden>🏠 Beranda</button></header>
<main id="app"></main>
<div id="print"></div>
<script src="js/core.js"></script>
<script src="js/mtk.js"></script>
<script src="js/bind.js"></script>
<script src="js/bing.js"></script>
<script src="js/ipa.js"></script>
<script src="js/materi.js"></script>
<script src="js/app.js"></script>
</body>
</html>
