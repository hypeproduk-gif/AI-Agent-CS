<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--no:#dc2626;--line:#e5e7eb}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.q{font-size:18px;margin:8px 0 12px}.q blockquote{margin:10px 0;padding:10px 12px;background:#f8fafc;border-left:4px solid #93c5fd;font-size:16px}
.img{text-align:center;margin:8px 0}.img svg{max-width:100%;height:auto}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt.pk{border-color:var(--pri);background:#eff6ff}.opt.ok{border-color:var(--ok);background:#dcfce7}.opt.no{border-color:var(--no);background:#fee2e2}

input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.days button{border:0;border-radius:6px;padding:6px 0;font-size:12px;background:#e5e7eb;cursor:pointer}
.days .d{background:#86efac}.days .c{outline:2px solid var(--pri)}

@media print{header,main{display:none!important}#print{display:block;font-size:12px}#print .pq{break-inside:avoid;margin:8px 0}#print svg{max-height:140px;width:auto}#print h2{break-before:page}#print h2:first-child{break-before:auto}#print .wm{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:9px;color:#888}}

.opt{position:relative}.opt.dm::after{content:"";position:absolute;right:7px;bottom:6px;width:4px;height:4px;border-radius:50%;background:#9ca3af}
</style>

<body>
<header><h1 id="title">📚 Siap Ujian Kelas 6<span id="lic"></span></h1><button id="homeBtn" hidden>🏠 Beranda</button></header>
<main id="app"></main>

<script>window.MODE="hemat";window.DEMO=true;window.DEMO_NAMA="Diandra Elsha";window.NOKODE=true;window.QUOTA={1:30,2:30,3:20}</script><script>// Inti generator: RNG berbibit (bank soal selalu sama), pembuat soal pilihan ganda, helper SVG.
(function (G) {
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeKit(seed) {
    const r = rng(seed);
    const K = {
      r,
      int: (a, b) => a + Math.floor(r() * (b - a + 1)),
      pick: (arr) => arr[Math.floor(r() * arr.length)],
      shuffle(arr) { const x = arr.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; },
      sample(arr, n) { return K.shuffle(arr).slice(0, n); },
      gcd: (a, b) => (b ? K.gcd(b, a % b) : Math.abs(a)),
      lcm: (a, b) => (a / K.gcd(a, b)) * b,
      fr(n, d) { // pecahan disederhanakan -> string
        const g = K.gcd(n, d); n /= g; d /= g;
        if (d === 1) return String(n);
        if (n > d) { const w = Math.floor(n / d); return w + " " + (n % d) + "/" + d; }
        return n + "/" + d;
      },
      num: (x) => Number(x).toLocaleString("id-ID", { maximumFractionDigits: 3 }),
      // Buat soal PG: jawaban benar + pengecoh -> 4 opsi unik teracak
      mk(level, topik, q, benar, pengecoh, bahas, img) {
        benar = String(benar);
        const seen = new Set([benar]); const d = [];
        for (const p of pengecoh) { const s = String(p); if (!seen.has(s)) { seen.add(s); d.push(s); } if (d.length === 3) break; }
        if (d.length < 3) return null;
        const opsi = K.shuffle([benar, ...d]);
        return { level, topik, q, img: img || null, opsi, jawab: opsi.indexOf(benar), bahas: bahas || "" };
      },
      // Pengecoh angka di sekitar jawaban
      near(x, spread) { const out = []; const s = spread || Math.max(1, Math.round(Math.abs(x) * 0.15)); for (let i = 0; i < 12; i++) { const v = x + K.pick([-1, 1]) * K.int(1, s); if (v !== x && v >= 0) out.push(v); } return out; },
    };
    return K;
  }
  // Kumpulkan soal unik sampai kuota per level terpenuhi
  function build(mapel, seed, templates, quota) {
    const K = makeKit(seed); const out = []; const seen = new Set();
    for (const lv of [1, 2, 3]) {
      const ts = templates[lv]; let got = 0, tries = 0, i = 0;
      const cap = Math.ceil((quota[lv] * 2.5) / ts.length), used = ts.map(() => 0);
      while (got < quota[lv] && tries < quota[lv] * 80) {
        tries++; const ti = i++ % ts.length; const t = ts[ti];
        if (used[ti] >= cap && tries < quota[lv] * 40) continue;
        const s = t(K); if (!s) continue;
        const key = s.q + "|" + (s.img || "") + "|" + s.opsi[s.jawab];
        if (seen.has(key)) continue;
        seen.add(key); used[ti]++; s.level = lv; s.mapel = mapel; out.push(s); got++;
      }
    }
    // Acak dalam level supaya topik bercampur tiap hari
    const res = [];
    for (const lv of [1, 2, 3]) res.push(...K.shuffle(out.filter((x) => x.level === lv)));
    res.forEach((s, i) => (s.id = mapel + "-" + String(i + 1).padStart(4, "0")));
    return res;
  }
  // ---------- SVG ----------
  const S = {
    wrap: (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">${body}</svg>`,
    text: (x, y, t, o) => `<text x="${x}" y="${y}" text-anchor="${(o && o.a) || "middle"}" fill="${(o && o.c) || "#222"}" font-size="${(o && o.s) || 14}">${t}</text>`,
    rectLabel(p, l, sat) {
      const W = 220, H = Math.max(60, Math.min(140, Math.round((220 * l) / p)));
      return S.wrap(300, H + 50, `<rect x="40" y="10" width="${W}" height="${H}" fill="#ffe8a3" stroke="#c48a00" stroke-width="2"/>` + S.text(150, H + 32, p + " " + sat) + S.text(270, 10 + H / 2 + 5, l + " " + sat, { a: "start" }));
    },
    square(s, sat) { return S.wrap(240, 180, `<rect x="50" y="15" width="130" height="130" fill="#cfe9ff" stroke="#1a6fb5" stroke-width="2"/>` + S.text(115, 168, s + " " + sat)); },
    triangle(a, t, sat) {
      return S.wrap(280, 190, `<polygon points="30,160 250,160 110,20" fill="#d6f5d6" stroke="#2e8b57" stroke-width="2"/><line x1="110" y1="20" x2="110" y2="160" stroke="#c00" stroke-dasharray="5 4"/><rect x="110" y="150" width="10" height="10" fill="none" stroke="#c00"/>` + S.text(140, 182, "alas = " + a + " " + sat) + S.text(115, 95, "t = " + t + " " + sat, { a: "start", c: "#c00" }));
    },
    box(p, l, t, sat) { // balok/kubus isometrik
      const P = 150, L = 60, T = p === l && l === t ? 110 : 90;
      const x = 30, y = 50;
      return S.wrap(300, 210,
        `<polygon points="${x},${y} ${x + P},${y} ${x + P + L},${y - 35} ${x + L},${y - 35}" fill="#e3d4ff" stroke="#5b3fa8" stroke-width="2"/>` +
        `<polygon points="${x + P},${y} ${x + P + L},${y - 35} ${x + P + L},${y - 35 + T} ${x + P},${y + T}" fill="#c9b3f5" stroke="#5b3fa8" stroke-width="2"/>` +
        `<rect x="${x}" y="${y}" width="${P}" height="${T}" fill="#efe6ff" stroke="#5b3fa8" stroke-width="2"/>` +
        S.text(x + P / 2, y + T + 20, p + " " + sat) + S.text(x + P + L / 2 + 22, y + T - 5, l + " " + sat) + S.text(x - 4, y + T / 2, t + " " + sat, { a: "end" }));
    },
    lshape(a, b, c, d, sat) { // gabungan: persegi panjang a x b dikurangi sudut c x d
      const k = 180 / Math.max(a, b); const A = a * k, B = b * k, C = c * k, D = d * k;
      return S.wrap(300, 240, `<polygon points="40,20 ${40 + A - C},20 ${40 + A - C},${20 + D} ${40 + A},${20 + D} ${40 + A},${20 + B} 40,${20 + B}" fill="#ffd9d9" stroke="#b22" stroke-width="2"/>` +
        S.text(40 + A / 2, 40 + B, a + " " + sat) + S.text(32, 20 + B / 2, b + " " + sat, { a: "end" }) + S.text(40 + (A - C) / 2, 15, a - c + " " + sat) + S.text(48 + A, 20 + D + (B - D) / 2, b - d + " " + sat, { a: "start" }));
    },
    bars(labels, vals, title, unit) {
      const max = Math.max(...vals), W = 60 + labels.length * 55, H = 200;
      let b = S.text(W / 2, 16, title, { s: 13 });
      const top = Math.ceil(max / 5) * 5 || 5;
      for (let i = 0; i <= 5; i++) { const v = (top / 5) * i, y = 170 - (v / top) * 140; b += `<line x1="40" x2="${W - 10}" y1="${y}" y2="${y}" stroke="#ddd"/>` + S.text(34, y + 4, v, { a: "end", s: 11 }); }
      labels.forEach((l, i) => { const h = (vals[i] / top) * 140; b += `<rect x="${52 + i * 55}" y="${170 - h}" width="34" height="${h}" fill="${["#60a5fa", "#f59e0b", "#34d399", "#f472b6", "#a78bfa", "#fb7185"][i % 6]}"/>` + S.text(69 + i * 55, 188, l, { s: 11 }); });
      return S.wrap(W, H + 10, b + (unit ? S.text(8, 30, unit, { a: "start", s: 10 }) : ""));
    },
    fracCircle(n, d) {
      let b = ""; const cx = 90, cy = 90, R = 70;
      for (let i = 0; i < d; i++) {
        const a1 = (2 * Math.PI * i) / d - Math.PI / 2, a2 = (2 * Math.PI * (i + 1)) / d - Math.PI / 2;
        const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1), x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
        b += `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${d === 1 ? 1 : 0} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${i < n ? "#ff9f43" : "#fff"}" stroke="#333" stroke-width="2"/>`;
      }
      return S.wrap(180, 180, b);
    },
    fracGrid(n, d) {
      const w = Math.min(40, 260 / d); let b = "";
      for (let i = 0; i < d; i++) b += `<rect x="${10 + i * w}" y="10" width="${w}" height="60" fill="${i < n ? "#2ecc71" : "#fff"}" stroke="#333" stroke-width="2"/>`;
      return S.wrap(20 + d * w, 80, b);
    },
    clock(h, m) {
      const ah = ((h % 12) + m / 60) * 30 * (Math.PI / 180), am = m * 6 * (Math.PI / 180);
      let b = `<circle cx="90" cy="90" r="80" fill="#fff" stroke="#333" stroke-width="4"/>`;
      for (let i = 1; i <= 12; i++) { const a = (i * 30 * Math.PI) / 180; b += S.text(90 + 64 * Math.sin(a), 95 - 64 * Math.cos(a), i, { s: 15 }); }
      b += `<line x1="90" y1="90" x2="${(90 + 40 * Math.sin(ah)).toFixed(1)}" y2="${(90 - 40 * Math.cos(ah)).toFixed(1)}" stroke="#222" stroke-width="6" stroke-linecap="round"/>`;
      b += `<line x1="90" y1="90" x2="${(90 + 60 * Math.sin(am)).toFixed(1)}" y2="${(90 - 60 * Math.cos(am)).toFixed(1)}" stroke="#d33" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="90" r="5"/>`;
      return S.wrap(180, 180, b);
    },
    angle(deg) {
      const a = (deg * Math.PI) / 180, x = 40, y = 130;
      return S.wrap(260, 150, `<line x1="${x}" y1="${y}" x2="${x + 190}" y2="${y}" stroke="#333" stroke-width="3"/><line x1="${x}" y1="${y}" x2="${(x + 150 * Math.cos(a)).toFixed(1)}" y2="${(y - 150 * Math.sin(a)).toFixed(1)}" stroke="#333" stroke-width="3"/><path d="M${x + 30},${y} A30,30 0 0 0 ${(x + 30 * Math.cos(a)).toFixed(1)},${(y - 30 * Math.sin(a)).toFixed(1)}" fill="none" stroke="#d33" stroke-width="2"/>`);
    },
    chain(items) { // rantai makanan dengan panah
      const w = 110; let b = `<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/></marker></defs>`;
      items.forEach((it, i) => {
        b += `<rect x="${10 + i * w}" y="20" width="85" height="44" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>` + S.text(52 + i * w, 47, it, { s: 13 });
        if (i < items.length - 1) b += `<line x1="${96 + i * w}" y1="42" x2="${118 + i * w}" y2="42" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar)"/>`;
      });
      return S.wrap(items.length * w, 84, b);
    },
    circuit(type, n) { // rangkaian seri / paralel dengan n lampu
      let b = `<rect x="20" y="70" width="14" height="40" fill="#555"/><rect x="38" y="80" width="6" height="20" fill="#555"/>` + S.text(30, 128, "baterai", { s: 11 });
      const bulb = (x, y) => `<circle cx="${x}" cy="${y}" r="13" fill="#fff59d" stroke="#333" stroke-width="2"/><path d="M${x - 6},${y - 6} L${x + 6},${y + 6} M${x + 6},${y - 6} L${x - 6},${y + 6}" stroke="#333"/>`;
      if (type === "seri") {

        for (let i = 0; i < n; i++) b += bulb(90 + i * (170 / n), 20);
      } else {
        b += `<polyline points="27,70 27,20 280,20 M27,110 27,160 280,160" fill="none" stroke="#333" stroke-width="2"/>`;
        for (let i = 0; i < n; i++) { const x = 120 + i * (150 / n); b += `<line x1="${x}" y1="20" x2="${x}" y2="160" stroke="#333" stroke-width="2"/>` + bulb(x, 90); }
      }
      return S.wrap(300, 180, b);
    },
    prep(kind) { // kotak dan bola untuk preposisi
      const box = `<rect x="110" y="70" width="90" height="70" fill="#d7a86e" stroke="#7a4f1d" stroke-width="2"/>`;
      const ball = (x, y) => `<circle cx="${x}" cy="${y}" r="16" fill="#e74c3c" stroke="#900"/>`;
      const pos = { on: [155, 54], under: [155, 158], "next to": [230, 124], behind: [175, 72], "in front of": [155, 115], in: [155, 105] };
      const [x, y] = pos[kind];
      if (kind === "behind") return S.wrap(300, 180, ball(x, y) + box);
      if (kind === "in") return S.wrap(300, 180, `<rect x="110" y="70" width="90" height="70" fill="#d7a86e" stroke="#7a4f1d" stroke-width="2" fill-opacity="0.45"/>` + ball(x, y));
      return S.wrap(300, 180, box + ball(x, y));
    },
    mirror(kind) {
      const shapes = { datar: `<line x1="40" y1="30" x2="40" y2="150" stroke="#4a90d9" stroke-width="8"/>`, cekung: `<path d="M60,30 Q20,90 60,150" fill="none" stroke="#4a90d9" stroke-width="8"/>`, cembung: `<path d="M30,30 Q70,90 30,150" fill="none" stroke="#4a90d9" stroke-width="8"/>` };
      return S.wrap(180, 180, shapes[kind] + `<line x1="160" y1="60" x2="55" y2="90" stroke="#f39c12" stroke-width="3"/>`);
    },
    emoji(e, label) { return S.wrap(160, 130, `<text x="80" y="85" text-anchor="middle" font-size="72">${e}</text>` + (label ? S.text(80, 120, label) : "")); },

  if (typeof module !== "undefined") module.exports = api; else G.CORE = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>// Tambahan gambar SVG untuk materi kelas 6.
(function (G) {
  const C = typeof module !== "undefined" ? require("./core.js") : G.CORE;
  const S = C.S;
  Object.assign(S, {
    circle(val, kind, sat) { // kind: "r" (jari-jari) atau "d" (diameter)
      const line = kind === "r" ? `<line x1="110" y1="100" x2="190" y2="100" stroke="#c00" stroke-width="2"/>` : `<line x1="30" y1="100" x2="190" y2="100" stroke="#c00" stroke-width="2"/>`;
      return S.wrap(240, 210, `<circle cx="110" cy="100" r="80" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="110" cy="100" r="3"/>${line}` + S.text(kind === "r" ? 150 : 110, 92, (kind === "r" ? "r = " : "d = ") + val + " " + sat, { c: "#c00" }));
    },
    cylinder(r, t, sat) {
      return S.wrap(290, 230, `<ellipse cx="110" cy="190" rx="70" ry="18" fill="#fde68a" stroke="#b45309" stroke-width="2"/><rect x="40" y="40" width="140" height="150" fill="#fef3c7" stroke="none"/><line x1="40" y1="40" x2="40" y2="190" stroke="#b45309" stroke-width="2"/><line x1="180" y1="40" x2="180" y2="190" stroke="#b45309" stroke-width="2"/><ellipse cx="110" cy="40" rx="70" ry="18" fill="#fde68a" stroke="#b45309" stroke-width="2"/><line x1="110" y1="40" x2="180" y2="40" stroke="#c00" stroke-width="2"/>` + S.text(146, 33, "r = " + r + " " + sat, { c: "#c00", s: 13 }) + S.text(196, 120, "t = " + t + " " + sat, { a: "start", s: 13 }));
    },
    prism(a, ts, t, sat) { // prisma segitiga siku-siku: alas segitiga a, tinggi segitiga ts, tinggi prisma t
      return S.wrap(345, 220, `<g transform="translate(45,0)"><polygon points="30,180 130,180 30,90" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><polygon points="130,180 250,140 150,50 30,90" fill="#bbf7d0" stroke="#15803d" stroke-width="2" fill-opacity=".6"/><line x1="30" y1="90" x2="150" y2="50" stroke="#15803d" stroke-width="2"/><line x1="130" y1="180" x2="250" y2="140" stroke="#15803d" stroke-width="2"/><line x1="150" y1="50" x2="250" y2="140" stroke="#15803d" stroke-width="2"/>` + S.text(80, 200, "a = " + a + " " + sat, { s: 13 }) + S.text(22, 140, ts + " " + sat, { a: "end", s: 13 }) + S.text(205, 175, "t = " + t + " " + sat, { s: 13 }) + `</g>`);
    },

function drillLemah() {
  const tp = {}; for (const h of [...Object.values(ST.hasil), ...Object.values(ST.draft), ...Object.values(ST.sim)]) for (const l of h.log || []) { const k = l.mapel + "|" + l.topik; tp[k] = tp[k] || [0, 0]; tp[k][1]++; if (l.ok) tp[k][0]++; }
  const lemah = Object.entries(tp).filter(([, v]) => v[1] >= 3).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).slice(0, 3).map(([k]) => k.split("|"));
  if (!lemah.length) return alert("Kerjakan beberapa paket dulu agar topik lemah terdeteksi.");

function bumpStreak() { if (ST.last !== today()) { const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10); ST.streak = ST.last === y ? ST.streak + 1 : 1; ST.last = today(); } }
function kuis(soal, o, ulang) {

  const src = done && done.pil ? done : key && !ulang && ST.draft[key] ? ST.draft[key] : null;

  <br><button class="btn full" id="fin" disabled>Selesai & lihat nilai</button></div>`;
  const tampil = (i) => { const q = soal[i], j = pil[i], ok = j === q.jawab, box = $("#q" + i);
    box.querySelectorAll(".opt").forEach((x, k) => { x.disabled = true; if (k === q.jawab) x.classList.add("ok"); else if (k === j) x.classList.add("no"); });
    box.querySelector(".fb").innerHTML = `<div class="bahas"><b>${ok ? "✅ Benar!" : "❌ Belum tepat."}</b> ${q.bahas}</div>`; };
  const update = () => { const n = Object.keys(pil).length, benar = Object.entries(pil).filter(([i, j]) => soal[i].jawab === j).length;
    $("#cnt").textContent = `${n}/${soal.length} dijawab`; $("#pg").style.width = (n / soal.length) * 100 + "%";
    $("#skor").innerHTML = n ? `${done ? "Skor" : "Skor sementara"}: <b>${benar} benar</b> dari ${n} soal${n < soal.length && key ? " · jawaban tersimpan otomatis, bisa dilanjutkan nanti" : ""}` : "";

  Object.keys(pil).forEach((i) => tampil(+i)); update();
  const first = soal.findIndex((_, i) => !(i in pil)); if (Object.keys(pil).length && first > 0 && !done) setTimeout(() => { $("#q" + first).scrollIntoView({ block: "start" }); scrollBy(0, -80); }, 50); else scrollTo(0, 0);
  if (done) $("#ulang").onclick = () => kuis(soal, o, true);
  app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
    const i = +b.dataset.i, j = +b.dataset.j, q = soal[i]; if (i in pil) return; pil[i] = j; const ok = j === q.jawab;
    log.push({ id: q.id, ok, topik: q.topik, mapel: q.mapel }); if (ok) delete ST.salah[q.id]; else ST.salah[q.id] = 1;

// ---------- Kode akses, lisensi, watermark ----------
async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join(""); }
async function cekKode(kode) {
  if (window.KODE_HASH) { try { return window.KODE_HASH.includes(await sha(kode)); } catch { return false; } }
  try { const r = await fetch("/api/verify", { method: "POST", body: JSON.stringify({ kode }) }); return (await r.json()).ok; } catch { return false; }
}
const LISENSI_URL = "";
const devId = () => ST.dev || (ST.dev = Math.random().toString(36).slice(2, 10));
async function server(aksi, data) { if (!LISENSI_URL) return null; try { const r = await fetch(LISENSI_URL, { method: "POST", body: JSON.stringify(Object.assign({ aksi, kode: await sha(ST.kode), dev: devId() }, data || {})) }); return await r.json(); } catch { return null; } }
function watermark() {
  document.getElementById("lic").textContent = ST.nama ? `Lisensi: ${ST.nama}${ST.kode ? " · " + ST.kode : ""}` : "";
  let w = document.getElementById("wm"); if (!ST.nama) { if (w) w.remove(); return; }
  if (!w) { w = document.createElement("div"); w.id = "wm"; document.body.appendChild(w); }
  const t = `Lisensi: ${esc(ST.nama)}${ST.kode ? " · " + ST.kode : ""}`; w.innerHTML = Array.from({ length: 14 }, () => `<span>${t}</span>`).join("");
}

  <input id="kd" placeholder="Kode dari halaman member" autocapitalize="characters"><br><br><button class="btn full" id="ak">Aktifkan</button><p id="msg" class="mut"></p></div>`;
  $("#ak").onclick = async () => { const k = $("#kd").value.trim().toUpperCase(); $("#msg").textContent = "Memeriksa..."; if (await cekKode(k)) { ST.kode = k; const r = await server("cek"); if (r && r.ok === false) { ST.kode = ""; $("#msg").textContent = "❌ " + r.pesan; return; } if (r && r.nama) ST.nama = r.nama; save(); home(); } else $("#msg").textContent = "❌ Kode tidak valid. Periksa lagi atau hubungi penjual."; };
}

function cetakMenu() {
  keluar();
  if (HEMAT) {
    app.innerHTML = `<div class="card"><h2>🖨️ Cetak</h2><button class="btn full" id="ca">Cetak SEMUA soal (320 soal + kunci & pembahasan)</button><br><br><button class="btn full sec" id="c3">Cetak ringkasan materi 4 mapel</button>

    $("#c3").onclick = () => cetakHTML(Object.keys(MAPEL).map((m) => `<h2>Materi ${MAPEL[m][0]} Kelas 6</h2>` + MATERI[m].map(([j, isi], i) => `<h3>${i + 1}. ${j}</h3>${isi}`).join("")).join(""));
    return;
  }
  const pertama = DRILL ? `<label>Cetak paket drill<select id="pm2">${Object.entries(MAPEL).map(([k, [n]]) => `<option value="${k}">${n}</option>`).join("")}</select></label><label>Nomor paket<select id="pk">${Array.from({ length: NP }, (_, i) => `<option>${i + 1}</option>`).join("")}</select></label><br><br><button class="btn full" id="c1">Cetak paket (${PER_PAKET} soal + kunci)</button><br><br><label>Simulasi<select id="sm2"><option value="MIX">Campuran</option>${Object.entries(MAPEL).map(([k, [n]]) => `<option value="${k}">${n}</option>`).join("")}</select></label><label>Nomor<select id="sn">${Array.from({ length: N_SIM }, (_, i) => `<option>${i + 1}</option>`).join("")}</select></label><br><br><button class="btn full" id="c4">Cetak simulasi (40 soal + kunci)</button>` : `<p><button class="btn full" id="c1">Soal hari ke-${pilihHari || hariAktif()} (4 mapel + kunci)</button></p>`;
  app.innerHTML = `<div class="card"><h2>🖨️ Cetak</h2>${pertama}<hr style="margin:16px 0;border:0;border-top:1px solid var(--line)">
  <label>Cetak semua soal satu mapel<select id="cm">${Object.entries(MAPEL).map(([k, [n]]) => `<option value="${k}">${n}</option>`).join("")}</select></label>
  <label>Level<select id="cl">${[1, 2, 3].map((l) => `<option value="${l}">Level ${l} (${BANK.MTK.filter((q) => q.level === l).length} soal)</option>`).join("")}</select></label><br><br>
  <button class="btn full sec" id="c2">Cetak soal + kunci jawaban</button><br><br><button class="btn full sec" id="c3">Cetak semua materi 4 mapel</button>
  <p class="mut">Tips: pilih “Simpan sebagai PDF” di jendela cetak untuk menyimpan file.</p></div>`;
  if (DRILL) { $("#c1").onclick = () => { const m = $("#pm2").value, k = +$("#pk").value; cetakSoal(`${MAPEL[m][0]} — Paket ${k}`, soalPaket(m, k)); }; $("#c4").onclick = () => { const m = $("#sm2").value, n = +$("#sn").value; cetakSoal(`Simulasi ${m === "MIX" ? "Campuran" : MAPEL[m][0]} #${n}`, soalSim(m, n)); }; }
  else $("#c1").onclick = () => cetakHari(pilihHari || hariAktif());
  $("#c2").onclick = () => { const m = $("#cm").value, lv = +$("#cl").value; cetakSoal(`${MAPEL[m][0]} — Level ${lv}`, BANK[m].filter((q) => q.level === lv)); };
  $("#c3").onclick = () => cetakHTML(Object.keys(MAPEL).map((m) => `<h2>Materi ${MAPEL[m][0]} Kelas 6</h2>` + MATERI[m].map(([j, isi], i) => `<h3>${i + 1}. ${j}</h3>${isi}`).join("")).join(""));
}
function cetakHTML(h) { $("#print").innerHTML = h + `<div class="wm">© ${PEMBUAT} · Lisensi pribadi ${esc(ST.nama || "")} ${ST.kode ? "· " + ST.kode : ""} · Dilarang disebarluaskan (UU No. 28 Th. 2014)</div>`; window.print(); }
const lembar = (s) => s.map((q, i) => `<div class="pq"><b>${i + 1}.</b> ${q.q}${q.img ? `<div>${q.img}</div>` : ""}<div>${q.opsi.map((o, j) => `${"abcd"[j]}. ${o}`).join("&nbsp;&nbsp;&nbsp; ")}</div></div>`).join("");
function cetakSoal(judul, s) { cetakHTML(`<h2>${judul}</h2><p>Nama: ______________ Tanggal: ________</p>` + lembar(s) + `<h2>Kunci Jawaban — ${judul}</h2><p>${s.map((q, i) => `${i + 1}${"abcd"[q.jawab]}`).join(", ")}</p>`); }
function cetakHari(d) { let h = "", kunci = ""; for (const [k, [n]] of Object.entries(MAPEL)) { const s = soalHari(k, d); h += `<h2>${n} — Hari ke-${d}</h2><p>Nama: ______________ Tanggal: ________</p>` + lembar(s); kunci += `<p><b>${n}:</b> ${s.map((q, i) => `${i + 1}${"abcd"[q.jawab]}`).join(", ")}</p>`; } cetakHTML(h + `<h2>Kunci Jawaban Hari ke-${d}</h2>` + kunci); }
function rapor() {
  keluar(); const tp = {};
  const sumber = [...Object.values(ST.hasil), ...Object.values(ST.draft), ...Object.values(ST.sim)];
  for (const h of sumber) for (const l of h.log || []) { const k = MAPEL[l.mapel][0] + " — " + l.topik; tp[k] = tp[k] || [0, 0]; tp[k][1]++; if (l.ok) tp[k][0]++; }
  const rataM = (m) => { const ls = sumber.flatMap((h) => (h.log || []).filter((l) => l.mapel === m)); return ls.length ? Math.round((ls.filter((l) => l.ok).length / ls.length) * 100) : "-"; };
  const lemah = Object.entries(tp).filter(([, v]) => v[1] >= 3).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).slice(0, 8);
  const sims = Object.entries(ST.sim).sort((a, b) => (a[1].tgl < b[1].tgl ? -1 : 1));
  app.innerHTML = `<div class="card"><h2>📊 Rapor ${esc(ST.nama)}</h2><table><tr><th>Mapel</th><th>% benar</th></tr>${Object.entries(MAPEL).map(([k, [n]]) => `<tr><td>${n}</td><td><b>${rataM(k)}</b></td></tr>`).join("")}</table></div>
  ${DRILL ? `<div class="card"><h3>Riwayat simulasi ujian</h3>${sims.length ? `<table>${sims.map(([k, h]) => `<tr><td>${k.startsWith("MIX") ? "Campuran" : MAPEL[k.split("-")[0]][0]} #${k.split("-")[1]}</td><td>${h.tgl}</td><td><b>${h.nilai}</b></td></tr>`).join("")}</table>` : `<p class="mut">Belum ada simulasi. Coba 1 simulasi setiap akhir pekan.</p>`}</div>` : ""}
  <div class="card"><h3>Topik yang perlu dilatih lagi</h3>${lemah.length ? `<table>${lemah.map(([k, v]) => `<tr><td>${k}</td><td>${Math.round((v[0] / v[1]) * 100)}% benar</td></tr>`).join("")}</table>` : `<p class="mut">Kerjakan beberapa latihan dulu agar terlihat polanya.</p>`}</div>
  <div class="card"><button class="btn sec" id="rst">Hapus nilai & progres</button><p class="mut">Nama anak terkunci sebagai pemilik lisensi dan tidak ikut terhapus.</p></div>`;
  $("#rst").onclick = () => { if (confirm("Hapus semua nilai dan progres? Nama tetap tersimpan.")) { ST = { nama: ST.nama, hasil: {}, salah: {}, draft: {}, sim: {}, streak: 0, last: "", kode: ST.kode, setuju: ST.setuju, ujian: ST.ujian }; save(); home(); } };
}
function ortu() {

}
// Tombol back HP/browser kembali ke beranda aplikasi, bukan keluar halaman.
function keluar() { $("#homeBtn").hidden = false; if (!(history.state && history.state.sub)) try { history.pushState({ sub: 1 }, ""); } catch {} }
window.addEventListener("popstate", () => { pilihHari = null; clearInterval(timerId); home(); scrollTo(0, 0); });
$("#homeBtn").onclick = () => { if (history.state && history.state.sub) return history.back(); pilihHari = null; clearInterval(timerId); home(); };
// ---------- Mode DEMO (untuk rekam layar konten): progres anak terisi otomatis dengan nilai wajar ----------
// Peluang benar per level: Dasar 80%, Menengah 65%, HOTS 45% (rata-rata kira-kira 65–75, seperti anak kelas 6 pada umumnya).
function seedDemo() {
  const r = CORE.rng(2611), PELUANG = [0, 0.8, 0.65, 0.45];
  const isi = (soal) => { const pil = {}, log = []; soal.forEach((q, i) => { const ok = r() < PELUANG[q.level]; pil[i] = ok ? q.jawab : (q.jawab + 1 + Math.floor(r() * 3)) % 4; log.push({ id: q.id, ok, topik: q.topik, mapel: q.mapel }); }); return { pil, log, benar: log.filter((l) => l.ok).length }; };
  ST = { nama: window.DEMO_NAMA || "Nama Anak", setuju: 1, hasil: {}, salah: {}, draft: {}, sim: {}, streak: 6, last: today(), demoSeed: 2, ujian: new Date(Date.now() + 12 * 864e5).toISOString().slice(0, 10) };
  const selesai = { MTK: 5, BIND: 4, BING: 4, IPA: 3 };
  for (const m in selesai) for (let k = 1; k <= selesai[m]; k++) { const s = soalPaket(m, k), h = isi(s); h.log.forEach((l) => (l.ok ? delete ST.salah[l.id] : (ST.salah[l.id] = 1))); ST.hasil[`P-${m}-${k}`] = { nilai: Math.round((h.benar / s.length) * 100), pil: h.pil, log: h.log, tgl: today() }; }
  { const s = soalPaket("MTK", 6), h = isi(s.slice(0, 4)); ST.draft["P-MTK-6"] = { pil: h.pil, log: h.log }; } // paket 6 sedang dikerjakan
  for (const [m, n, menit] of [["MIX", 1, 54], ["MTK", 1, 58]]) { const s = soalSim(m, n), h = isi(s); h.log.forEach((l) => { if (!l.ok) ST.salah[l.id] = 1; }); ST.sim[`${m}-${n}`] = { nilai: Math.round((h.benar / s.length) * 100), pil: h.pil, log: h.log, tgl: today(), menit }; }
  save();
}
if (window.DEMO && ST.demoSeed !== 2) seedDemo();
home();
