<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopee Autopost</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e3e6;--acc:#ee4d2d}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#f2f2f3;--mute:#9a9aa0;--line:#2e2e33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:0 0 16px}h2{font-size:17px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px}small{color:var(--mute);font-weight:400}
input[type=text],input[type=url],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:160px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:12px 20px;font:600 15px system-ui;margin-top:16px;cursor:pointer;width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
img,video{max-width:100%;border-radius:8px}a{color:var(--acc)}
.list a{display:block;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.st{font-size:13px;color:var(--mute);word-break:break-word}
.load{display:none}form.busy .load{display:block}form.busy button{opacity:.5}
</style></head><body><main>{% block body %}{% endblock %}</main></body></html>
