const S={cat:0,p:D.patterns[1].id,s:0,m:"broll"};

function render(){

 const allVO=sc.scenes.map(x=>x.vo).join("\n"), allPr=sc.scenes.map((x,i)=>`Bagian ${i+1}: ${x.ai+D.suffix}`).join("\n\n");

}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
