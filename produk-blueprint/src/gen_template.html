<title>Generator Konten Dapur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
/* layout: 3 steps stacked (pola → naskah → hasil), result as scene cards; one column on phone */
:root{--bg:#fbfaf7;--fg:#22261f;--muted:#5d6457;--line:#e2e1d8;--accent:#c2410c;--soft:#f1efe6;--card:#ffffff;--on:#fff;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a16;--fg:#e9eae3;--muted:#a3a99b;--line:#30352d;--accent:#fb923c;--soft:#22261f;--card:#1d211b;--on:#171a16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a16;--fg:#e9eae3;--muted:#a3a99b;--line:#30352d;--accent:#fb923c;--soft:#22261f;--card:#1d211b;--on:#171a16;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font:800 clamp(26px,5vw,38px)/1.1 var(--display);margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted)}
.step h2{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;gap:8px;align-items:center}
.step h2 span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on);font-size:12px;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt b{font:600 15px var(--display)}
.opt small{color:var(--muted);font-size:12.5px}
.opt .n{font:12px var(--mono);color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.result{border-top:2px solid var(--accent);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.rhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end}
.rhead h3{font:800 22px/1.2 var(--display);margin:0}
.rhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.why{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px}
.why b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.hooks{margin:4px 0 0;padding-left:20px}
.scene{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:4px 14px}
.scene .t{font:13px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;grid-row:span 3}
.scene .vo{font-size:16px;min-width:0}
.scene .ov{font-weight:700;font-size:13px;letter-spacing:.02em;min-width:0}
.scene .vo .k{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.scene .ov::before{content:"Tulisan di layar:  ";font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.scene .prod{background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:6px;min-width:0}
.scene .prod .lbl{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.scene .prod code{font:12.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;display:block}
.scene .prod .brt{margin:0;font-size:14.5px}
.scene .prod .cp{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;letter-spacing:0;text-transform:none;padding:0}
@media (max-width:480px){.scene{grid-template-columns:1fr}.scene .t{grid-row:auto}}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.start{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.start td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.start td:first-child{font:13px var(--mono);color:var(--accent);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.result{animation:in .25s ease}}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
<main>
<header><h1>Generator Konten Dapur</h1><p class="lede">Pilih barangnya, pilih gaya videonya. Contoh lengkap langsung muncul: apa yang diucapkan, tulisan di layar, dan apa yang direkam.</p></header>

<details><summary>Baru mulai? Ikuti panduan 7 hari pertama</summary><table class="start" id="start"></table></details>

<section class="step"><h2><span>1</span>Pilih gaya video</h2>
<div class="chips" id="cats" role="group" aria-label="Jenis barang"></div>
<div class="opts" id="pats"></div></section>

<section class="step"><h2><span>2</span>Pilih contoh video</h2><div class="opts" id="scripts"></div></section>

<section class="step"><h2><span>3</span>Mau bikin pakai apa?</h2>
<div class="seg" role="group" aria-label="Cara bikin video"><button type="button" id="m-broll" data-m="broll">Rekam sendiri pakai HP</button><button type="button" id="m-ai" data-m="ai">Pakai AI, tanpa rekam</button></div></section>

<section class="result" id="result" aria-live="polite"></section>
</main>
<div class="toast" id="toast" hidden></div>
<script>
const D=__DATA__, CATS=__CATS__;
const S={cat:0,p:D.patterns[1].id,s:0,m:"broll"};
try{const v=JSON.parse(localStorage.getItem("gen-dapur")||"{}");Object.assign(S,v)}catch(e){}
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pat=()=>D.patterns.find(p=>p.id===S.p)||D.patterns[0];
function save(){try{localStorage.setItem("gen-dapur",JSON.stringify(S))}catch(e){}}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,1600)}
function copy(text){const ok=()=>toast("Tersalin");if(navigator.clipboard){navigator.clipboard.writeText(text).then(ok,()=>fallback(text))}else fallback(text)}
function fallback(text){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Tersalin")}catch(e){toast("Salin manual: teks sudah dipilih")}ta.remove()}
function render(){
 $("start").innerHTML=D.start.map(r=>`<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b><br>${esc(r[2])}</td></tr>`).join("");
 $("cats").innerHTML=CATS.map((c,i)=>`<button type="button" class="chip" data-cat="${i}" aria-pressed="${i===S.cat}">${esc(c[0])}</button>`).join("");
 const allow=CATS[S.cat][1], list=D.patterns.filter(p=>!allow||allow.includes(p.id));
 if(!list.find(p=>p.id===S.p)){S.p=list[0].id;S.s=0}
 $("pats").innerHTML=list.map(p=>`<button type="button" class="opt" data-p="${p.id}" aria-pressed="${p.id===S.p}"><span class="n">Gaya ${p.id}</span><b>${esc(p.name)}</b><small>${esc(p.sub)}. Cocok untuk: ${esc(p.cocok)}</small></button>`).join("");
 const P=pat(); if(S.s>=P.scripts.length)S.s=0;
 $("scripts").innerHTML=P.scripts.map((s,i)=>`<button type="button" class="opt" data-s="${i}" aria-pressed="${i===S.s}"><span class="n">Contoh ${i+1}</span><b>${esc(s.produk)}</b><small>${esc(s.durasi)} · ${s.scenes.length} bagian</small></button>`).join("");
 document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===S.m));
 const sc=P.scripts[S.s], ai=S.m==="ai";
 const scenes=sc.scenes.map((x,i)=>{const prod=ai?x.ai+D.suffix:x.br;
  return `<div class="scene"><div class="t">Bagian ${i+1}<br>detik ${esc(x.t)}</div><div class="vo"><span class="k">Ucapkan</span>${esc(x.vo)}</div><div class="ov">${esc(x.ov)}</div>
  <div class="prod"><div class="lbl"><span>${ai?"Perintah untuk AI":"Yang direkam"}</span>${ai?`<button type="button" class="cp" data-copy="${esc(prod)}">Salin</button>`:""}</div>${ai?`<code>${esc(prod)}</code>`:`<p class="brt">${esc(prod)}</p>`}</div></div>`}).join("");
 const allVO=sc.scenes.map(x=>x.vo).join("\n"), allPr=sc.scenes.map((x,i)=>`Bagian ${i+1}: ${x.ai+D.suffix}`).join("\n\n");
 const tips=ai?"Tempel perintah AI satu per satu di Google Flow. Satu perintah jadi satu potongan video pendek. Upload juga foto barang aslinya supaya bentuknya sama. Lalu gabungkan semua potongan di CapCut, rekam suaramu, dan tambahkan tulisan di layar.":"Rekam pakai HP posisi berdiri (tegak), dekat jendela biar terang. Nggak perlu tampil wajah, cukup tangan. Dekatkan HP ke barang supaya suaranya terdengar. Setelah semua bagian direkam, gabungkan di CapCut, rekam suaramu, lalu tambahkan tulisan di layar.";
 $("result").innerHTML=`<div class="rhead"><div><h3>${esc(sc.produk)}</h3><p>Gaya ${P.id} · ${esc(P.name)} · ${esc(sc.durasi)}</p></div>
 <div class="actions"><button type="button" class="btn" data-copy="${esc(allVO)}">Salin semua ucapan</button>${ai?`<button type="button" class="btn primary" data-copy="${esc(allPr)}">Salin semua perintah AI</button>`:""}</div></div>
 <div class="why"><b>Cara bikinnya</b>${esc(tips)}</div>
 ${scenes}
 <div class="why"><b>Mau ganti kalimat pembuka? Pilih salah satu</b><ol class="hooks">${P.hooks.map(h=>`<li>${esc(h)}</li>`).join("")}</ol></div>
 <div class="why"><b>Kenapa video ini bikin orang beli</b>${esc(P.psi)}</div>`;
 save();
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.copy!==undefined)return copy(b.dataset.copy);
 if(b.dataset.cat!==undefined){S.cat=+b.dataset.cat}
 else if(b.dataset.p){S.p=b.dataset.p;S.s=0}
 else if(b.dataset.s!==undefined){S.s=+b.dataset.s}
 else if(b.dataset.m){S.m=b.dataset.m}
 else return; render();});
render();
</script>
